[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartlyq"
dynamic = ["version"]
description = "Official Python SDK for the SmartlyQ API - social posting, AI content generation, SEO, CRM, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "SmartlyQ" }]
keywords = ["smartlyq", "social-media", "api", "sdk", "ai", "content-generation", "seo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://docs.smartlyq.com"
Repository = "https://github.com/SmartlyQ/smartlyq-python"

[tool.hatch.version]
path = "smartlyq/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["smartlyq"]

[dependency-groups]
dev = ["pytest>=8", "build"]
